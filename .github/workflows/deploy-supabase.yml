name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Supabase CLI
        run: |
          curl -sSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.deb -o supabase.deb
          sudo dpkg -i supabase.deb

      - name: Deploy changed Edge Functions
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            CHANGED=$(ls supabase/functions/ | grep -v "^_")
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" \
              | grep '^supabase/functions/' \
              | grep -v '^supabase/functions/_shared' \
              | awk -F'/' '{print $3}' \
              | sort -u)
          fi

          if [ -z "$CHANGED" ]; then
            echo "No function changes detected."
            exit 0
          fi

          echo "Functions to deploy: $CHANGED"
          for fn in $CHANGED; do
            echo ">>> Deploying: $fn"
            supabase functions deploy "$fn" \
              --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
              --no-verify-jwt \
              --use-api
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
